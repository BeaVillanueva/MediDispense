<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/backend/public

    # Railway terminates TLS at its edge; tell PHP the original request was HTTPS
    # so session cookies are Secure and generated photo URLs use https://.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
